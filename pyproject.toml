[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sopverify"
version = "0.1.0"
description = "SOP compliance checker: verify procedure end-states in video from a few expert demonstrations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0 (code). IMPACT data: CC BY-NC-SA 4.0, see README." }
# Versions are lower bounds. The exact working set on Colab is recorded in docs/DECISIONS.md.
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "networkx>=3.1",
  "av>=11.0",
  "opencv-python-headless>=4.8",
  "transformers>=4.57",
  "pillow>=10.0",
  "tqdm>=4.65",
  "jinja2>=3.1",
  "plotly>=5.18",
  "typer>=0.12",
  "requests>=2.31",
  "huggingface_hub>=0.26",
  "pyarrow>=14",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
app = ["gradio>=4.44"]
# vLLM pins its own torch build, so it is installed by notebooks/04_vlm.ipynb in a
# fresh runtime instead of here (see docs/DECISIONS.md, D-012).
vlm = ["qwen-vl-utils>=0.0.10", "accelerate>=0.30"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
sopverify = "sopverify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sopverify = ["report/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "data: needs IMPACT annotations or the IMPACT sample (skipped when absent)",
  "gpu: needs CUDA (skipped when absent)",
]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false

[tool.ruff.lint.isort]
known-first-party = ["sopverify"]
known-local-folder = ["helpers"]
